<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Student Map</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { primary: "#3c83f6" },
          fontFamily: { display: ["Inter", "sans-serif"] },
        }
      }
    }
  </script>

  <style>
    :root{
      --sideW: 320px;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --border: rgba(255,255,255,.08);
      --bg1: rgba(17, 20, 24, 0.85);
      --bg2: rgba(27, 32, 39, 0.92);
      --muted: rgba(255,255,255,.55);
      --text: #ffffff;
      --primary: #3c83f6;
    }
    html, body { height:100%; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#111418; color:#fff; overflow:hidden; }

    /* Dark scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    .glass-panel{
      background: var(--bg1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    /* Layout */
    .main{
      height:100vh;
      display:grid;
      grid-template-columns: 1fr var(--sideW);
      min-height:0;
      transition: grid-template-columns .22s ease;
    }
    body.side-collapsed{
      --sideW: 0px;
    }

    .map-wrap{ position:relative; min-height:0; overflow:hidden; }
    #map{ position:absolute; inset:0; }

    .side{
      height:100vh;
      min-height:0;
      overflow:hidden;
      border-left: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,.45);
      transition: transform .22s ease, opacity .22s ease;
      transform: translateX(0);
      opacity: 1;
    }
    body.side-collapsed .side{
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    .list{
      min-height:0;
      overflow:auto;
      padding: 14px;
    }

    /* Top Bar - grid prevents overlap */
    .topbar{
      position:absolute;
      top:12px; left:12px; right:12px;
      z-index: 20;
      pointer-events:none;
    }
    .topbar-inner{
      pointer-events:auto;
      display:grid;
      grid-template-columns: auto minmax(280px, 1fr) auto;
      gap: 12px;
      align-items:center;
      padding: 10px;
      border-radius: 999px;
    }
    @media (max-width: 1100px){
      .topbar-inner{
        grid-template-columns: 1fr;
        border-radius: 18px;
      }
      .top-left, .top-center, .top-right{
        justify-content: center;
      }
      .top-right{
        flex-wrap: wrap;
      }
    }

    /* Search */
    .search-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.20);
      border: 1px solid var(--border);
    }
    .search-wrap input{
      width:100%;
      background: transparent;
      border: none;
      outline:none;
      color: var(--text);
      font-size: 13px;
    }
    .search-wrap .btn{
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.06);
      cursor:pointer;
      transition:.15s;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .search-wrap .btn:hover{ background: rgba(255,255,255,.10); }

    /* Mini pills for MAX & RAD */
    .miniPill{
      display:flex; align-items:center;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      padding: 6px 12px;
      gap: 8px;
      height: 36px;
    }
    .miniPill input{
      width: 54px;
      text-align:center;
      background:transparent;
      border:none;
      outline:none;
      padding:0;
      color:#fff;
      font-weight:800;
      font-size:12px;
    }
    .miniPill .lbl{
      font-size:10px;
      color: rgba(255,255,255,.55);
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:700;
    }

    .applyBtn{
      background: var(--primary);
      border: 1px solid rgba(255,255,255,.12);
      color:#fff;
      font-weight:900;
      font-size: 12px;
      padding: 9px 16px;
      border-radius: 999px;
      cursor:pointer;
      transition:.15s;
      height: 36px;
      display:flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
    }
    .applyBtn:hover{ background: #2563eb; }

    /* Connected badge */
    .badge{
      display:flex; align-items:center; gap:10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .dot{
      width:10px; height:10px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 14px rgba(60,131,246,.45);
    }

    .logoutBtn{
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      font-weight: 900;
      cursor:pointer;
      transition:.15s;
      white-space:nowrap;
    }
    .logoutBtn:hover{ background: rgba(255,255,255,.06); }

    /* Bottom stats */
    .statsbar{
      position:absolute;
      left:14px;
      bottom:14px;
      z-index: 20;
      pointer-events:auto;
      display:flex;
      gap:8px;
      flex-wrap: wrap;
      max-width: 70vw;
    }
    .statChip{
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 900;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .statChip span.label{
      font-size: 10px;
      letter-spacing:.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }

    /* Sidebar toggle handle (always visible) */
    .sideToggle{
      position:absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      pointer-events:auto;
      width: 40px;
      height: 44px;
      border-radius: 14px;
      background: rgba(0,0,0,.30);
      border: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.15s;
    }
    .sideToggle:hover{ background: rgba(255,255,255,.08); }

    /* ===== Custom Dropdown (your design, dark themed) ===== */
    .custom-select-container {
      position: relative;
      width: 160px;
      user-select: none;
    }
    .select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,.18);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
      height: 36px;
      gap: 10px;
      white-space: nowrap;
    }
    .select-trigger:hover { border-color: rgba(255,255,255,.18); }
    .arrow {
      width: 18px;
      height: 18px;
      transition: transform 0.2s;
      color: rgba(255,255,255,.65);
      flex: 0 0 auto;
    }
    .options-menu {
      position: absolute;
      top: 115%;
      left: 0;
      right: 0;
      background: rgba(17, 20, 24, 0.98);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.55);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.15s ease;
      z-index: 200;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      /* Scrollable properties */
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* Custom scrollbar for dropdown */
    .options-menu::-webkit-scrollbar {
      width: 6px;
    }
    .options-menu::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      margin: 4px 0;
    }
    .options-menu::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }
    .options-menu::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.25);
    }
    .option {
      padding: 10px 12px;
      cursor: pointer;
      color: #fff;
      transition: background 0.1s;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .option:hover {
      background-color: var(--primary);
      color: white;
    }
    .option.selected {
      background-color: rgba(60,131,246,.14);
      color: #cfe2ff;
      font-weight: 900;
    }
    .custom-select-container.open .options-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .custom-select-container.open .select-trigger {
      border-color: rgba(60,131,246,.55);
      box-shadow: 0 0 0 3px rgba(60,131,246,.12);
    }
    .custom-select-container.open .arrow {
      transform: rotate(180deg);
      color: #cfe2ff;
    }

    /* ===== Pins overlay ===== */
    .gm-student{ position:absolute; left:0; top:0; user-select:none; }
    .gm-pin-wrap{
      position:absolute;
      transform: translate(-50%, -50%);
      pointer-events:auto;
      cursor:pointer;
    }
    .gm-pin{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #dc2626;
      border: 2px solid rgba(255,255,255,0.95);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight: 900;
      font-size: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .gm-student.selected .gm-pin{
      box-shadow: 0 0 22px rgba(220,38,38,.45), 0 12px 28px rgba(0,0,0,.40);
      border-width: 3px;
      width: 38px;
      height: 38px;
      font-size: 13px;
    }
    .gm-popover{
      pointer-events:auto;
      position:absolute;
      left:50%;
      bottom:46px;
      transform: translateX(-50%);
      width: 300px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(17, 20, 24, 0.90);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 14px;
      display:none;
    }
    .gm-student.selected .gm-popover{ display:block; }
    .gm-popover .tri{
      position:absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width:0; height:0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid rgba(17, 20, 24, 0.90);
      filter: drop-shadow(0 -1px 0 rgba(255,255,255,.10));
    }
    .gm-father{ display:none; }
    .gm-popover:hover .gm-father{ display:block; }

    /* Auth overlay */
    #authOverlay{ display:none; }

    @media (max-width: 900px){
      .main{ grid-template-columns: 1fr; }
      .side{ display:none; }
      .sideToggle{ display:none; }
      .custom-select-container{ width: 150px; }
    }
  </style>
</head>

<body class="font-display selection:bg-primary/30">
  <div class="main">
    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>

      <!-- Sidebar toggle handle -->
      <button id="sideToggle" class="sideToggle" title="Toggle sidebar">
        <span id="sideToggleIcon" class="material-symbols-outlined text-white/80">chevron_right</span>
      </button>

      <!-- TOP BAR -->
      <div class="topbar">
        <div class="glass-panel topbar-inner">
          <!-- Left -->
          <div class="top-left flex items-center gap-2 justify-start">
            <div class="badge">
              <div class="dot"></div>
              <span id="statusBadge">Connecting…</span>
            </div>
            <button id="logoutBtn" class="logoutBtn" style="display:none;">Logout</button>
          </div>

          <!-- Center -->
          <div class="top-center flex items-center justify-center min-w-0">
            <div class="search-wrap w-full max-w-[520px]">
              <span class="material-symbols-outlined text-white/60 text-[18px]">search</span>
              <input id="searchInput" type="text" placeholder="Search map locations..." autocomplete="off" />
              <button id="clearBtn" class="btn" title="Clear pins">
                <span class="material-symbols-outlined text-[16px]">close</span>
                Clear
              </button>
            </div>
          </div>

          <!-- Right -->
          <div class="top-right flex items-center gap-2 justify-end">
            <!-- Sort dropdown -->
            <div class="custom-select-container" id="sortDropdown"></div>

            <!-- Route dropdown -->
            <div class="custom-select-container" id="routeDropdown"></div>

            <div class="miniPill">
              <span class="lbl">MAX</span>
              <input id="maxInput" type="number" min="1" max="2000" value="50" />
            </div>

            <div class="miniPill">
              <span class="lbl">RAD</span>
              <input id="radiusInput" type="text" value="1km" />
            </div>

            <button id="applyBtn" class="applyBtn">Apply</button>
          </div>
        </div>
      </div>

      <!-- BOTTOM LEFT STATS -->
      <div class="statsbar">
        <div class="statChip"><span class="label">100m</span> <span id="stat100">-</span></div>
        <div class="statChip"><span class="label">500m</span> <span id="stat500">-</span></div>
        <div class="statChip"><span class="label">1km</span> <span id="stat1k">-</span></div>
        <div class="statChip"><span class="label">2km</span> <span id="stat2k">-</span></div>
        <div class="statChip"><span class="label">5km</span> <span id="stat5k">-</span></div>
      </div>

      <!-- AUTH OVERLAY -->
      <div id="authOverlay" class="fixed inset-0 z-[99999] flex items-center justify-center p-4">
        <div class="absolute inset-0 z-0 bg-gradient-to-br from-[#101722] via-[#0b1019] to-black"></div>
        <div class="absolute top-[-20%] left-[20%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-[-20%] right-[20%] w-[500px] h-[500px] bg-blue-900/10 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="relative z-10 w-full max-w-[440px] flex flex-col bg-[#111418]/60 backdrop-blur-xl border border-white/10 shadow-2xl rounded p-8">
          <div class="flex flex-col items-center text-center mb-8">
            <div class="w-12 h-12 rounded bg-primary/20 flex items-center justify-center mb-4 border border-primary/10">
              <span class="material-symbols-outlined text-primary" style="font-size:28px;">security</span>
            </div>

            <h2 class="text-white text-[26px] font-bold leading-tight tracking-[-0.015em] mb-3 font-display">
              Staff Login
            </h2>
            <p class="text-[#9ca7ba] text-sm font-normal leading-normal max-w-[300px] font-display">
              This page is protected. Login to view student data.
            </p>
          </div>

          <div class="flex flex-col gap-5 w-full font-display">
            <label class="flex flex-col w-full gap-2">
              <p class="text-white text-sm font-medium leading-normal ml-1">Email</p>
              <div class="relative flex items-center">
                <input id="emailInput" type="email"
                  class="form-input flex w-full resize-none overflow-hidden rounded text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#3b4454] bg-[#1b2027] focus:border-primary h-12 placeholder:text-[#6b7280] px-4 pl-11 text-base font-normal leading-normal transition-all"
                  placeholder="Enter your school email" />
                <div class="absolute left-3 text-[#9ca7ba] flex items-center justify-center pointer-events-none">
                  <span class="material-symbols-outlined text-[20px]">mail</span>
                </div>
              </div>
            </label>

            <label class="flex flex-col w-full gap-2">
              <p class="text-white text-sm font-medium leading-normal ml-1">Password</p>
              <div class="relative flex w-full items-stretch">
                <input id="passInput" type="password"
                  class="form-input flex w-full resize-none overflow-hidden rounded text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#3b4454] bg-[#1b2027] focus:border-primary h-12 placeholder:text-[#6b7280] px-4 pl-11 pr-12 text-base font-normal leading-normal transition-all"
                  placeholder="Enter your password" />
                <div class="absolute left-3 top-0 h-full text-[#9ca7ba] flex items-center justify-center pointer-events-none">
                  <span class="material-symbols-outlined text-[20px]">lock</span>
                </div>
                <button id="passToggle" type="button"
                  class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-[#9ca7ba] hover:text-white transition-colors rounded-r z-20">
                  <span id="passIcon" class="material-symbols-outlined text-[20px]">visibility</span>
                </button>
              </div>
            </label>

            <div class="pt-2">
              <button id="loginBtn"
                class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded h-12 px-5 bg-[#3c83f6] hover:bg-[#2563eb] transition-colors text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-blue-900/20">
                <span class="truncate">Login</span>
              </button>
            </div>

            <div class="min-h-[20px] flex items-center justify-center">
              <p id="authMsg" class="text-xs text-[#545e6f] font-normal">Authorized personnel only</p>
            </div>
          </div>
        </div>

        <div class="absolute bottom-6 z-10">
          <p class="text-[#545e6f] text-xs font-display">School District Location Services</p>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="side glass-panel flex flex-col">
      <div class="p-6 pb-4 border-b border-white/5">
        <div class="flex items-center gap-3 mb-4">
          <div class="bg-center bg-no-repeat bg-cover rounded-full h-10 w-10 ring-2 ring-white/10"
               style="background-image:url('');"></div>
          <div class="flex flex-col min-w-0">
            <h1 class="text-white text-sm font-bold leading-tight">Student Tracking</h1>
            <p id="sideSub" class="text-gray-400 text-xs font-normal truncate">—</p>
          </div>
        </div>

        <button class="w-full bg-[#282e39] hover:bg-[#323946] text-white text-xs font-medium py-2 rounded-lg transition-colors border border-white/5">
          List View
        </button>
      </div>

      <div id="list" class="list flex-1 space-y-2"></div>

      <div class="p-4 border-t border-white/5 bg-[#111418]/50">
        <button id="exportBtn"
          class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-4 bg-primary hover:bg-blue-600 text-white text-sm font-bold leading-normal tracking-[0.015em] transition-colors shadow-lg shadow-blue-900/20">
          <span class="truncate">Export Report</span>
        </button>
      </div>
    </aside>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Your config -->
  <script src="./config.js"></script>

  <script>
    /***********************
     * CONFIG + CLIENTS
     ***********************/
    const CFG = window.APP_CONFIG || {};
    const SUPABASE_URL = CFG.SUPABASE_URL || "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || "YOUR_SUPABASE_ANON_KEY";

    const GOOGLE_MAPS_API_KEY =
      CFG.GMAPS_KEY ||
      CFG.GOOGLE_MAPS_API_KEY ||
      "YOUR_GOOGLE_MAPS_API_KEY";

    // Create Supabase client with proper auth config
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const DEFAULT_CENTER = { lat: 27.6094, lng: 75.1399 };
    const MVP_STORE_KEY = "student_map_mvp_v2";

    const mvpSet = new Set(safeJsonParse(localStorage.getItem(MVP_STORE_KEY), []));

    let map;
    let autocomplete;

    let placeMarker = null;
    let radiusCircle = null;

    let isAuthed = false;
    let authChecked = false;

    let allStudents = [];
    let allStudentsReady = false;
    let allStudentsLoading = false;

    let currentResults = [];
    let currentTotalInRange = 0;

    let lastCenter = null;
    let selectedIdKey = null;

    let StudentOverlayClass = null;
    const overlays = [];

    // UI elements
    const statusBadge = document.getElementById("statusBadge");
    const logoutBtn = document.getElementById("logoutBtn");
    const listEl = document.getElementById("list");
    const sideSub = document.getElementById("sideSub");

    const maxInput = document.getElementById("maxInput");
    const radiusInput = document.getElementById("radiusInput");

    const applyBtn = document.getElementById("applyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");
    const searchInput = document.getElementById("searchInput");

    const sideToggle = document.getElementById("sideToggle");
    const sideToggleIcon = document.getElementById("sideToggleIcon");

    const authOverlay = document.getElementById("authOverlay");
    const loginBtn = document.getElementById("loginBtn");
    const emailInput = document.getElementById("emailInput");
    const passInput = document.getElementById("passInput");
    const authMsg = document.getElementById("authMsg");
    const passToggle = document.getElementById("passToggle");
    const passIcon = document.getElementById("passIcon");

    // Custom dropdown instances
    let sortDD = null;
    let routeDD = null;

    /***********************
     * SAFE HELPERS
     ***********************/
    function setStatus(text){ statusBadge.textContent = text; }
    function esc(s){ return (s ?? "").toString().replace(/[<>]/g, ""); }
    function safeJsonParse(str, fallback){ try { return JSON.parse(str); } catch { return fallback; } }

    function parseRadiusKm(str){
      const s = String(str ?? "").trim().toLowerCase();
      if (!s) return 0;
      const num = parseFloat(s.replace("km","").trim());
      return Number.isFinite(num) ? Math.max(0, num) : 0;
    }

    function haversineKm(aLat, aLng, bLat, bLng){
      const R = 6371;
      const toRad = (x) => x * Math.PI / 180;
      const dLat = toRad(bLat - aLat);
      const dLng = toRad(bLng - aLng);
      const lat1 = toRad(aLat);
      const lat2 = toRad(bLat);

      const h =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(dLng/2) * Math.sin(dLng/2);

      const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
      return R * c;
    }

    // ✅ DEDUPE helpers
    function normKeyPart(v){
      return String(v ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }
    function makeDedupeKey(name, cls, route){
      return `${normKeyPart(name)}|${normKeyPart(cls)}|${normKeyPart(route)}`;
    }
    function studentQualityScore(s){
      let score = 0;
      if (s.father && s.father.trim()) score += 3;
      if (s.nps_score != null && Number.isFinite(s.nps_score)) score += 2;
      if (s.section && s.section.trim()) score += 1;
      if (s.route_no && s.route_no.trim()) score += 1;
      return score;
    }

    function isMvp(student){
      if (mvpSet.has(student.idKey)) return true;
      if (student.legacyKeys && Array.isArray(student.legacyKeys)){
        return student.legacyKeys.some(k => mvpSet.has(k));
      }
      return false;
    }

    function toggleMvp(idKey){
      if (mvpSet.has(idKey)) mvpSet.delete(idKey);
      else mvpSet.add(idKey);
      localStorage.setItem(MVP_STORE_KEY, JSON.stringify([...mvpSet]));
    }

    function setStats(stats){

      if (!stats){
        s("stat100","-"); s("stat500","-"); s("stat1k","-"); s("stat2k","-"); s("stat5k","-");
        return;
      }
      s("stat100", String(stats["100m"] ?? 0));
      s("stat500", String(stats["500m"] ?? 0));
      s("stat1k",  String(stats["1km"] ?? 0));
      s("stat2k",  String(stats["2km"] ?? 0));
      s("stat5k",  String(stats["5km"] ?? 0));
    }

    function computeStatsFromDistances(distancesKm){
      const out = { "100m":0, "500m":0, "1km":0, "2km":0, "5km":0 };
      for (const d of distancesKm){
        if (d <= 0.1) out["100m"]++;
        if (d <= 0.5) out["500m"]++;
        if (d <= 1.0) out["1km"]++;
        if (d <= 2.0) out["2km"]++;
        if (d <= 5.0) out["5km"]++;
      }
      return out;
    }

    /***********************
     * CUSTOM DROPDOWN CLASS - UPDATED FOR SCROLLABLE
     ***********************/
    class CustomDropdown {
      constructor(mountEl, { placeholder, options, value, onChange, widthPx, maxHeight = 320 }){
        this.mountEl = mountEl;
        this.onChange = onChange || (()=>{});
        this.options = options || [];
        this.value = value ?? "";
        this.placeholder = placeholder || "Select…";
        this.maxHeight = maxHeight;

        mountEl.style.width = widthPx ? `${widthPx}px` : "";

        this.container = document.createElement("div");
        this.container.className = "custom-select-container";
        this.container.innerHTML = `
          <div class="select-trigger" role="button" tabindex="0">
            <span class="triggerText">${esc(this.placeholder)}</span>
            <svg class="arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
          <div class="options-menu" style="max-height: ${this.maxHeight}px;"></div>
        `;
        mountEl.appendChild(this.container);

        this.trigger = this.container.querySelector(".select-trigger");
        this.triggerTextEl = this.container.querySelector(".triggerText");
        this.menu = this.container.querySelector(".options-menu");

        this.trigger.addEventListener("click", () => this.toggle());
        this.trigger.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " "){
            e.preventDefault();
            this.toggle();
          }
        });

        document.addEventListener("click", (e) => {
          if (!this.container.contains(e.target)) this.close();
        });

        this.render();
        if (this.value !== undefined) this.setValue(this.value, false);
      }

      setOptions(options){
        this.options = options || [];
        this.render();
        if (this.value && !this.options.some(o => o.value === this.value)){
          this.setValue("", true);
        } else {
          this.syncTriggerText();
        }
      }

      render(){
        this.menu.innerHTML = "";
        for (const opt of this.options){
          const div = document.createElement("div");
          div.className = "option";
          div.dataset.value = opt.value;
          div.textContent = opt.label;
          div.title = opt.label; // Add tooltip for truncated text

          if (opt.value === this.value) div.classList.add("selected");

          div.addEventListener("click", () => {
            this.setValue(opt.value, true);
            this.close();
          });

          this.menu.appendChild(div);
        }
        this.syncTriggerText();
      }

      syncTriggerText(){
        const found = this.options.find(o => o.value === this.value);
        this.triggerTextEl.textContent = found ? found.label : this.placeholder;
      }

      setValue(val, fire=true){
        this.value = val;
        [...this.menu.querySelectorAll(".option")].forEach(el => {
          el.classList.toggle("selected", el.dataset.value === val);
        });
        this.syncTriggerText();
        if (fire) this.onChange(val);
      }

      toggle(){ 
        this.container.classList.toggle("open"); 
        // When opening, scroll to selected option
        if (this.container.classList.contains("open") && this.value) {
          setTimeout(() => {
            const selectedOption = this.menu.querySelector(`.option[data-value="${this.value}"]`);
            if (selectedOption) {
              selectedOption.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          }, 50);
        }
      }
      close(){ this.container.classList.remove("open"); }
      getValue(){ return this.value; }
    }

    /***********************
     * LOAD + NORMALIZE
     ***********************/
    function normalizeStudent(row){
      if (!row) return null;

      const lat = Number(row.student_latitude ?? row.latitude ?? row.lat);
      const lng = Number(row.student_longitude ?? row.longitude ?? row.lng ?? row.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;

      const name = String(row.student_name ?? row.name ?? "").trim();
      const cls  = String(row.student_class ?? row.class ?? "").trim();
      const sec  = String(row.student_section ?? row.section ?? "").trim();

      const father = String(
        row.students_parent ??
        row.student_parent ??
        row.parent ??
        row.parent_name ??
        row.father ??
        row.father_name ??
        ""
      ).trim();

      const route = String(row.route_no ?? row.route ?? row.route_number ?? "").trim();
      const sr = String(row.student_sr ?? row.sr ?? "").trim();
      const npsRaw = row.nps_score ?? row.nps ?? null;
      const nps = (npsRaw === null || npsRaw === undefined || npsRaw === "") ? null : Number(npsRaw);
      const id = row.id ?? null;

      // ✅ DEDUPE KEY: Name + Class + Route (case-insensitive)
      const dedupeKey = makeDedupeKey(name, cls, route);

      // Keep legacy keys for MVP migration (if earlier stored)
      const legacyKeys = [];
      if (id != null) legacyKeys.push(`id:${id}`);
      if (sr) legacyKeys.push(`sr:${sr}`);

      // ✅ Use dedupeKey as the stable key everywhere
      const idKey = dedupeKey;

      return {
        id,
        idKey,
        legacyKeys,
        name,
        class: cls,
        section: sec,
        father,
        route_no: route,
        nps_score: Number.isFinite(nps) ? nps : null,
        lat, lng
      };
    }

    async function loadAllStudentsOnce(){
      if (allStudentsReady || allStudentsLoading) return;
      allStudentsLoading = true;
      setStatus("Loading students…");
      sideSub.textContent = "Loading…";

      const pageSize = 1000;
      const rawAll = [];
      let page = 0;

      while (true){
        const from = page * pageSize;
        const to = from + pageSize - 1;

        const { data, error } = await sb.from("students").select("*").range(from, to);
        if (error){
          console.error(error);
          setStatus("Load error");
          sideSub.textContent = "Failed to load students";
          allStudentsLoading = false;
          return;
        }
        if (!data || data.length === 0) break;

        rawAll.push(...data);
        if (data.length < pageSize) break;
        page++;
      }

      // ✅ Deduplicate by (Name + Class + Route)
      const dedup = new Map();

      for (const r of rawAll){
        const s = normalizeStudent(r);
        if (!s) continue;

        const key = s.idKey; // now equals dedupeKey

        if (!dedup.has(key)){
          dedup.set(key, s);
          continue;
        }

        // If duplicate exists, keep the better row (more complete data)
        const existing = dedup.get(key);
        const sa = studentQualityScore(existing);
        const sbq = studentQualityScore(s);

        if (sbq > sa) {
          dedup.set(key, s);
        } else if (sbq === sa) {
          const an = (existing.nps_score == null ? -Infinity : existing.nps_score);
          const bn = (s.nps_score == null ? -Infinity : s.nps_score);
          if (bn > an) dedup.set(key, s);
        }
      }

      allStudents = [...dedup.values()];

      // ✅ MVP migration: old stars based on id/sr => map to new dedupeKey
      let changed = false;
      for (const s of allStudents){
        if (s.legacyKeys?.some(k => mvpSet.has(k)) && !mvpSet.has(s.idKey)){
          mvpSet.add(s.idKey);
          changed = true;
        }
      }
      if (changed){
        localStorage.setItem(MVP_STORE_KEY, JSON.stringify([...mvpSet]));
      }

      allStudentsReady = true;
      allStudentsLoading = false;

      buildRouteOptions();

      setStatus(`Connected • ${allStudents.length} students`);
      sideSub.textContent = `${allStudents.length} students loaded`;
      
      // Auto-refresh the UI to show data
      renderSidebar([]);
    }

    function buildRouteOptions(){
      const set = new Set();
      for (const s of allStudents){
        const v = (s.route_no ?? "").toString().trim();
        if (v) set.add(v);
      }
      const routes = [...set].sort((a,b)=>{
        const na = Number(a), nb = Number(b);
        const aNum = Number.isFinite(na), bNum = Number.isFinite(nb);
        if (aNum && bNum) return na - nb;
        if (aNum && !bNum) return -1;
        if (!aNum && bNum) return 1;
        return String(a).localeCompare(String(b));
      });

      const opts = [
        { value: "", label: "Route: All" },
        ...routes.map(r => ({ value: r, label: `Route #${r}` }))
      ];
      if (routeDD) routeDD.setOptions(opts);
    }

    /***********************
     * SORTING (MVP always on top)
     ***********************/
    function sortMode(){
      return sortDD.getValue() || "distance";
    }

    function sortWithMvp(list, mode){
      const m = mode || "distance";
      return list.sort((a,b)=>{
        const am = isMvp(a) ? 1 : 0;
        const bm = isMvp(b) ? 1 : 0;
        if (am !== bm) return bm - am;

        const ad = a.dist_km ?? Infinity;
        const bd = b.dist_km ?? Infinity;

        const an = (a.nps_score == null || !Number.isFinite(a.nps_score)) ? -Infinity : a.nps_score;
        const bn = (b.nps_score == null || !Number.isFinite(b.nps_score)) ? -Infinity : b.nps_score;

        if (m === "distance"){
          if (ad !== bd) return ad - bd;
          return String(a.name).localeCompare(String(b.name));
        }
        if (m === "nps"){
          if (bn !== an) return bn - an;
          if (ad !== bd) return ad - bd;
          return String(a.name).localeCompare(String(b.name));
        }
        // both
        if (bn !== an) return bn - an;
        if (ad !== bd) return ad - bd;
        return String(a.name).localeCompare(String(b.name));
      });
    }

    /***********************
     * AUTH SYSTEM - FIXED WITH AUTO-REFRESH
     ***********************/
    async function checkAuth() {
      try {
        const { data: { session }, error } = await sb.auth.getSession();
        
        if (error) {
          console.error('Auth session error:', error);
          showLogin();
          return false;
        }
        
        if (session?.user) {
          // User is authenticated
          isAuthed = true;
          hideLogin();
          logoutBtn.style.display = "inline-flex";
          setStatus("Connected");
          
          // Load students data and then refresh UI
          await loadAllStudentsOnce();
          
          // Initialize or refresh Google Maps
          await initOrRefreshMap();
          
          // Refresh UI components
          refreshUI();
          
          return true;
        } else {
          // No session found
          showLogin();
          return false;
        }
      } catch (error) {
        console.error('Auth check failed:', error);
        showLogin();
        return false;
      }
    }

    function showLogin() {
      isAuthed = false;
      authOverlay.style.display = "flex";
      logoutBtn.style.display = "none";
      setStatus("Login required");
      sideSub.textContent = "—";
      
      // Clear any existing data and UI

      if (map) {

        if (placeMarker) placeMarker.setMap(null);
        if (radiusCircle) radiusCircle.setMap(null);
      }
      
      // Clear sidebar
      renderSidebar([]);

    function hideLogin() {
      authOverlay.style.display = "none";
      logoutBtn.style.display = "inline-flex";
      
      // Reset auth message
      authMsg.textContent = "Authorized personnel only";
      authMsg.className = "text-xs text-[#545e6f] font-normal";
      
      // Clear password field for security
      passInput.value = "";
    }

    async function login() {
      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        authMsg.textContent = "Please enter email and password";
        authMsg.className = "text-xs text-red-400 font-semibold";
        return;
      }

      authMsg.textContent = "Signing in…";
      authMsg.className = "text-xs text-[#9ca7ba] font-medium";
      loginBtn.disabled = true;

      try {
        const { data, error } = await sb.auth.signInWithPassword({ 
          email, 
          password 
        });

        if (error) {
          throw error;
        }

        // Success - auto-refresh the page
        authMsg.textContent = "Login successful! Redirecting...";
        authMsg.className = "text-xs text-emerald-300 font-semibold";
        
        // Wait a moment for user to see success message, then refresh
        setTimeout(async () => {
          await checkAuth();
          loginBtn.disabled = false;
        }, 1000);
        
      } catch (error) {
        console.error('Login error:', error);
        
        let errorMessage = "Login failed";
        if (error.message.includes("Invalid login credentials")) {
          errorMessage = "Invalid email or password";
        } else if (error.message.includes("Email not confirmed")) {
          errorMessage = "Please confirm your email first";
        } else if (error.message.includes("User not found")) {
          errorMessage = "Account not found";
        }
        
        authMsg.textContent = errorMessage;
        authMsg.className = "text-xs text-red-400 font-semibold";
        loginBtn.disabled = false;
      }
    }

    async function logout() {
      try {
        const { error } = await sb.auth.signOut();
        if (error) throw error;
        
        // Clear all app state
        clearState();
        allStudents = [];
        allStudentsReady = false;
        
        // Show login screen
        showLogin();
        
        // Clear form fields
        emailInput.value = "";
        passInput.value = "";
        
        // Show logout success message
        authMsg.textContent = "Logged out successfully";
        authMsg.className = "text-xs text-emerald-300 font-semibold";
        
      } catch (error) {
        console.error('Logout error:', error);
        setStatus("Logout failed");
      }
    }

    /***********************
     * OVERLAY PINS
     ***********************/
    function buildOverlayClass(){
      StudentOverlayClass = class StudentOverlay extends google.maps.OverlayView {
        constructor(position, student){
          super();
          this.position = new google.maps.LatLng(position.lat, position.lng);
          this.student = student;
          this.div = null;
        }
        onAdd(){
          const div = document.createElement("div");
          div.className = "gm-student";

          const rank = this.student.rank ?? "";
          const dist = Number(this.student.dist_km ?? 0);
          const distTxt = Number.isFinite(dist) ? `${dist.toFixed(2)} km` : "-";
          const routeTxt = this.student.route_no ? `Route #${esc(this.student.route_no)}` : "Route -";
          const npsTxt = (this.student.nps_score == null || !Number.isFinite(this.student.nps_score)) ? "-" : String(this.student.nps_score);

          div.innerHTML = `
            <div class="gm-popover">
              <div class="flex items-start gap-3">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2">
                    <h3 class="text-sm font-bold truncate">${esc(this.student.name)}</h3>
                    <span class="text-yellow-400 text-[12px] font-extrabold">#${esc(rank)}</span>
                  </div>
                  <p class="text-xs text-white/60">Class ${esc(this.student.class)} • Sec ${esc(this.student.section)} • ${routeTxt}</p>
                  <p class="text-[11px] text-white/50 mt-2">Dist: ${esc(distTxt)} • NPS: ${esc(npsTxt)}</p>

                  <div class="gm-father mt-3 text-xs text-white/80 border-t border-white/10 pt-3">
                    Father: ${esc(this.student.father || "-")}
                  </div>
                </div>
              </div>
              <div class="tri"></div>
            </div>

            <div class="gm-pin-wrap" title="Click to view">
              <div class="gm-pin">${esc(rank)}</div>
            </div>
          `;

          div.querySelector(".gm-pin-wrap").addEventListener("click", (e) => {
            e.stopPropagation();
            selectStudent(this.student.idKey);
          });

          div.querySelector(".gm-popover").addEventListener("click", (e) => e.stopPropagation());

          this.div = div;
          this.getPanes().overlayMouseTarget.appendChild(div);

          if (this.student.idKey === selectedIdKey){
            this.div.classList.add("selected");
          }
        }
        draw(){
          if (!this.div) return;
          const proj = this.getProjection();
          if (!proj) return;
          const point = proj.fromLatLngToDivPixel(this.position);
          if (!point) return;

          this.div.style.left = point.x + "px";
          this.div.style.top  = point.y + "px";
          this.div.style.zIndex = String(100000 + Math.round(point.y));
        }
        onRemove(){
          if (this.div){
            this.div.remove();
            this.div = null;
          }
        }
      };
    }

    function buildOverlays(list){
      clearOverlays();
      if (!map || !StudentOverlayClass) return;
      for (const s of list){
        const overlay = new StudentOverlayClass({ lat: s.lat, lng: s.lng }, s);
        overlay.setMap(map);
        overlays.push(overlay);
      }
    }

    function selectStudent(idKey){
      selectedIdKey = idKey;

      for (const o of overlays){
        if (o.div){
          if (o.student.idKey === idKey) o.div.classList.add("selected");
          else o.div.classList.remove("selected");
        }
      }
      renderSidebar(currentResults);
    }

    // ✅ Smooth pan + smooth zoom
    function smoothZoomTo(targetZoom){
      const stepMs = 90;
      const current = map.getZoom() || 0;
      if (current === targetZoom) return;

      const step = current < targetZoom ? 1 : -1;

      const tick = () => {
        const z = map.getZoom() || 0;
        if ((step > 0 && z >= targetZoom) || (step < 0 && z <= targetZoom)) return;
        map.setZoom(z + step);
        setTimeout(tick, stepMs);
      };
      tick();
    }

    function panToStudent(s){
      if (!map) return;

      const target = { lat: s.lat, lng: s.lng };
      const targetZoom = Math.max(map.getZoom() || 12, 16);

      map.panTo(target);
      google.maps.event.addListenerOnce(map, "idle", () => {
        smoothZoomTo(targetZoom);
      });

      selectStudent(s.idKey);
    }

    /***********************
     * SIDEBAR RENDER + CLICK TO FOCUS
     ***********************/
    function renderSidebar(list){
      listEl.innerHTML = "";

      const routeVal = routeDD ? routeDD.getValue() : "";
      const radiusKm = parseRadiusKm(radiusInput.value);

      if (!allStudentsReady){
        sideSub.textContent = "Loading…";
      } else if (!lastCenter && !routeVal){
        sideSub.textContent = `${allStudents.length} students loaded`;
      } else if (routeVal){
        sideSub.textContent = `Route #${routeVal} • Showing ${list.length} out of ${currentTotalInRange}`;
      } else {
        const suffix = radiusKm > 0 ? `within ${radiusKm} km` : "all";
        sideSub.textContent = `Showing ${list.length} out of ${currentTotalInRange} • ${suffix}`;
      }

      if (!list || list.length === 0){
        const empty = document.createElement("div");
        empty.className = "text-sm text-white/60 p-3";
        empty.textContent = routeVal ? "No students for this route." : "Click on the map or search a place to see students.";
        listEl.appendChild(empty);
        return;
      }

      for (const s of list){
        const isActive = (s.idKey === selectedIdKey);
        const distTxt = Number.isFinite(s.dist_km) ? `${s.dist_km.toFixed(2)} km` : "-";
        const npsTxt = (s.nps_score == null || !Number.isFinite(s.nps_score)) ? "-" : String(s.nps_score);
        const fatherTxt = s.father && s.father.trim() ? s.father.trim() : "-";

        const starFilled = isMvp(s);
        const card = document.createElement("div");

        card.className =
          "group flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all " +
          (isActive
            ? "bg-primary/10 border border-primary/20"
            : "hover:bg-white/5 border border-transparent hover:border-white/5");

        card.setAttribute("data-idkey", s.idKey);

        card.innerHTML = `
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${
            isActive ? "bg-primary text-white shadow-lg shadow-blue-900/20"
                     : "bg-white/5 text-white/70 group-hover:bg-white/10"
          } text-xs font-black transition-colors">${esc(s.rank)}</div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <p class="text-sm ${isActive ? "font-bold text-white" : "font-semibold text-white/90 group-hover:text-white"} truncate">${esc(s.name)}</p>

              <button class="mvpBtn material-symbols-outlined text-[18px] ${starFilled ? "text-yellow-400" : "text-yellow-400/40"}"
                      data-action="mvp" data-idkey="${esc(s.idKey)}" title="Mark MVP"
                      style="font-variation-settings:'FILL' ${starFilled ? 1 : 0}, 'wght' 700;">
                star
              </button>
            </div>

            <p class="text-xs text-white/55 truncate">
              Class ${esc(s.class)} • Sec ${esc(s.section)} • ${s.route_no ? `Route #${esc(s.route_no)}` : "Route -"}
            </p>

            <p class="text-[11px] text-white/45 mt-1 truncate">
              Father: ${esc(fatherTxt)} • NPS: ${esc(npsTxt)} • ${esc(distTxt)}
            </p>
          </div>
        `;

        listEl.appendChild(card);
      }
    }

    listEl.addEventListener("click", (e) => {
      const mvpBtn = e.target.closest("[data-action='mvp']");
      if (mvpBtn){
        e.stopPropagation();
        const idKey = mvpBtn.getAttribute("data-idkey");
        if (!idKey) return;
        toggleMvp(idKey);
        rerunCurrentMode();
        return;
      }

      const card = e.target.closest("[data-idkey]");
      if (!card) return;

      const idKey = card.getAttribute("data-idkey");
      const s = currentResults.find(x => x.idKey === idKey);
      if (!s) return;

      panToStudent(s);
    });

    /***********************
     * SEARCH MODES
     ***********************/
    function rerunCurrentMode(){
      const routeVal = routeDD ? routeDD.getValue() : "";
      const center = getActiveCenter();
      if (routeVal) runRouteMode(center);
      else if (lastCenter) runNearbyMode(center);
      else renderSidebar(currentResults);
    }

    function runNearbyMode(center){
      if (!allStudentsReady) return;

      lastCenter = center;
      setCenterMarker(center);

      const radiusKm = parseRadiusKm(radiusInput.value);
      makeRadiusCircle(center, radiusKm);

      const maxN = Math.max(1, Math.min(2000, parseInt(maxInput.value || "50", 10)));
      const mode = sortMode();

      setStatus("Searching…");

      const withDist = [];
      for (const s of allStudents){
        const d = haversineKm(center.lat, center.lng, s.lat, s.lng);
        if (radiusKm > 0 && d > radiusKm) continue;
        withDist.push({ ...s, dist_km: d });
      }

      currentTotalInRange = withDist.length;

      sortWithMvp(withDist, mode);
      const sliced = withDist.slice(0, maxN);
      for (let i=0;i<sliced.length;i++) sliced[i].rank = i+1;

      currentResults = sliced;

      setStats(computeStatsFromDistances(withDist.map(x => x.dist_km)));
      buildOverlays(currentResults);
      renderSidebar(currentResults);

      setStatus(`Connected • ${allStudents.length} students`);
    }

    function runRouteMode(center){
      if (!allStudentsReady) return;

      lastCenter = center;
      setCenterMarker(center);

      if (radiusCircle) radiusCircle.setMap(null);
      radiusCircle = null;

      const routeVal = routeDD ? routeDD.getValue() : "";
      const mode = sortMode();

      if (!routeVal){
        runNearbyMode(center);
        return;
      }

      setStatus("Loading route…");

      const filtered = [];
      for (const s of allStudents){
        if (String(s.route_no || "").trim() !== String(routeVal).trim()) continue;
        const d = haversineKm(center.lat, center.lng, s.lat, s.lng);
        filtered.push({ ...s, dist_km: d });
      }

      currentTotalInRange = filtered.length;

      sortWithMvp(filtered, mode);

      // Route mode shows all
      for (let i=0;i<filtered.length;i++) filtered[i].rank = i+1;

      currentResults = filtered;

      setStats(computeStatsFromDistances(filtered.map(x => x.dist_km)));
      buildOverlays(currentResults);
      renderSidebar(currentResults);

      setStatus(`Connected • ${allStudents.length} students`);
    }

    function clearState(){
      clearOverlays();
      currentResults = [];
      currentTotalInRange = 0;
      lastCenter = null;

      if (placeMarker) placeMarker.setMap(null);
      placeMarker = null;

      if (radiusCircle) radiusCircle.setMap(null);
      radiusCircle = null;

      setStats(null);
      renderSidebar([]);
      sideSub.textContent = allStudentsReady ? `${allStudents.length} students loaded` : "—";
      setStatus(allStudentsReady ? `Connected • ${allStudents.length} students` : "Connected");
    }

    /***********************
     * EXPORT
     ***********************/
    function exportCurrent(){
      if (!currentResults || currentResults.length === 0){
        setStatus("Nothing to export");
        return;
      }
      const rows = [["Rank","Name","Class","Section","Father","Route","NPS","Distance(km)","MVP"]];
      for (const s of currentResults){
        rows.push([
          s.rank,
          s.name,
          s.class,
          s.section,
          s.father || "",
          s.route_no,
          s.nps_score ?? "",
          (Number.isFinite(s.dist_km) ? s.dist_km.toFixed(3) : ""),
          isMvp(s) ? "YES" : ""
        ]);
      }
      const csv = rows.map(r => r.map(v => {
        const t = String(v ?? "");
        if (/[,"\n]/.test(t)) return `"${t.replace(/"/g,'""')}"`;
        return t;
      }).join(",")).join("\n");

      const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "student_report.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /***********************
     * MAP INIT
     ***********************/
    async function initMapApp(){
      const darkStyle = [
        { elementType: "geometry", stylers: [{ color: "#1b2027" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#9ca7ba" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#1b2027" }] },
        { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#6b7280" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#2a3442" }] },
        { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#1b2027" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#0b1220" }] },
        { featureType: "administrative", elementType: "geometry", stylers: [{ color: "#2a3442" }] },
      ];

      map = new google.maps.Map(document.getElementById("map"), {
        center: DEFAULT_CENTER,
        zoom: 12,
        styles: darkStyle,
        mapTypeControl: true,
        streetViewControl: false,
        fullscreenControl: true
      });

      buildOverlayClass();

      autocomplete = new google.maps.places.Autocomplete(searchInput, {
        fields: ["geometry", "name", "formatted_address"],
        componentRestrictions: { country: "in" }
      });

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place?.geometry?.location){
          setStatus("No result. Try another search.");
          return;
        }
        const loc = place.geometry.location;
        const center = { lat: loc.lat(), lng: loc.lng() };
        map.panTo(center);
        map.setZoom(15);

        const routeVal = routeDD.getValue();
        if (routeVal) runRouteMode(center);
        else runNearbyMode(center);
      });

      map.addListener("click", (e) => {
        const center = { lat: e.latLng.lat(), lng: e.latLng.lng() };
        const routeVal = routeDD.getValue();
        if (routeVal) runRouteMode(center);
        else runNearbyMode(center);
      });

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearState();
      });

      applyBtn.addEventListener("click", () => {
        const center = getActiveCenter();
        const routeVal = routeDD.getValue();
        if (routeVal) runRouteMode(center);
        else {
          if (!lastCenter){
            setStatus("Click map or search first");
            return;
          }
          runNearbyMode(center);
        }
      });

      exportBtn.addEventListener("click", exportCurrent);
    }

    function loadGoogleMaps(){
      return new Promise((resolve, reject) => {
        if (window.google?.maps){
          initMapApp();
          resolve();
          return;
        }
        window.__initMapsCallback = async () => {
          try{
            await initMapApp();
            resolve();
          }catch(err){
            console.error(err);
            reject(err);
          }
        };

        const s = document.createElement("script");
        s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=places&callback=__initMapsCallback`;
        s.async = true;
        s.defer = true;
        s.onerror = () => reject(new Error("Failed to load Google Maps"));
        document.head.appendChild(s);
      });
    }

    // Global promise error -> show on badge
    window.addEventListener("unhandledrejection", (e) => {
      console.error(e);
      const msg = (e.reason && (e.reason.message || e.reason)) || "Unknown error";
      setStatus("Error: " + msg);
    });

    /***********************
     * SIDEBAR COLLAPSE
     ***********************/
    function syncSideToggleIcon(){
      const collapsed = document.body.classList.contains("side-collapsed");
      sideToggleIcon.textContent = collapsed ? "chevron_left" : "chevron_right";
      sideToggle.title = collapsed ? "Show sidebar" : "Hide sidebar";
    }
    sideToggle.addEventListener("click", () => {
      document.body.classList.toggle("side-collapsed");
      syncSideToggleIcon();
      setTimeout(() => { if (map) google.maps.event.trigger(map, "resize"); }, 250);
    });
    syncSideToggleIcon();

    /***********************
     * START
     ***********************/
    (async () => {
      // Bind auth UI first
      bindAuthUI();

      // Initialize dropdowns - make route dropdown scrollable with taller max height
      sortDD = new CustomDropdown(document.getElementById("sortDropdown"), {
        placeholder: "Distance",
        value: "distance",
        widthPx: 160,
        maxHeight: 200,
        options: [
          { value: "distance", label: "Distance" },
          { value: "nps", label: "NPS" },
          { value: "both", label: "NPS + Distance" },
        ],
        onChange: () => rerunCurrentMode()
      });

      routeDD = new CustomDropdown(document.getElementById("routeDropdown"), {
        placeholder: "Route: All",
        value: "",
        widthPx: 160,
        maxHeight: 320, // Taller for more route options
        options: [{ value: "", label: "Route: All" }],
        onChange: () => {
          const center = getActiveCenter();
          const routeVal = routeDD.getValue();
          if (routeVal) runRouteMode(center);
          else {
            if (lastCenter) runNearbyMode(center);
            else clearState();
          }
        }
      });

      // Check auth status
      await checkAuth();

      // Set up auth state listener
      sb.auth.onAuthStateChange((event, session) => {
        console.log('Auth state changed:', event);
        if (event === 'SIGNED_IN') {
          // Auto-refresh on sign in
          setTimeout(() => checkAuth(), 100);
        } else if (event === 'SIGNED_OUT') {
          // Auto-refresh on sign out
          setTimeout(() => checkAuth(), 100);
        } else if (event === 'USER_UPDATED') {
          // Refresh when user data is updated
          checkAuth();
        }
      });

      // Load Google Maps if authenticated
      if (isAuthed) {
        if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.includes("YOUR_")){
          setStatus("Maps key missing");
          return;
        }
        await initOrRefreshMap();
      }

      if (allStudentsReady) renderSidebar([]);
    })();
  </script>
</body>
</html>
