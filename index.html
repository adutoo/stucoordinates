<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Student Map (Google Maps)</title>

  <style>
    :root{
      --bg:#0b1220; --muted:#a7b4d6; --text:#e9eeff; --border:rgba(255,255,255,.10);
      --shadow:0 12px 40px rgba(0,0,0,.40);
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; overflow:hidden; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
    }

    .app{ height:100vh; overflow:hidden; }
    .main{
      height:100%;
      display:grid;
      grid-template-columns: 1fr minmax(260px, 340px);
      min-height:0;
    }

    .map-wrap{ position:relative; min-height:0; overflow:hidden; }
    #map{ height:100%; width:100%; }

    /* Overlay controls */
    .map-ui{
      position:absolute;
      top:12px; left:12px; right:12px;
      z-index:10;
      pointer-events:none;
      display:flex; flex-direction:column; gap:10px;
    }
    .ui-row{ display:flex; align-items:center; gap:10px; pointer-events:none; }
    .ui-row.center{ justify-content:center; }
    .ui-row.space{ justify-content:space-between; }

    .badge, .control, .btn, .statbox{
      pointer-events:auto;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(15, 26, 51, .70);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .badge{
      padding:7px 10px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .control{
      display:flex; gap:8px; align-items:center;
      padding:7px 10px;
      font-size:12px;
      color:var(--muted);
    }
    .control input{
      width:110px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.25);
      color:var(--text);
      outline:none;
    }
    .control.search input{ width:340px; }
    .btn{
      padding:8px 12px;
      color:var(--text);
      cursor:pointer;
    }
    .btn:hover{ background:rgba(255,255,255,.10); }

    /* Bottom-left stats */
    .stats-panel{
      position:absolute;
      left:12px;
      bottom:12px;
      z-index:10;
      pointer-events:none;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      max-width:60vw;
    }
    .statbox{
      pointer-events:none;
      padding:8px 10px;
      border-radius:14px;
      font-size:12px;
      color:var(--text);
      background:rgba(15, 26, 51, .72);
      white-space:nowrap;
    }
    .statbox span{ color:var(--muted); font-weight:800; }

    /* Sidebar */
    .side{
      border-left:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      padding:14px;
      min-height:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .side h2{
      margin:0 0 10px;
      font-size:14px;
      color:var(--muted);
      font-weight:700;
      flex:0 0 auto;
    }
    .list{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      padding-bottom:10px;
      overscroll-behavior: contain;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .rowcard{
      display:flex; gap:10px; align-items:flex-start;
      padding:10px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      border-radius:var(--radius);
    }
    .rankPill{
      width:28px; height:28px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      font-weight:900;
      font-size:12px;
      flex:0 0 auto;
    }
    .meta{ min-width:0; }
    .name{ font-weight:900; font-size:13px; line-height:1.1; margin:0; }
    .sub{ margin:4px 0 0; font-size:12px; color:var(--muted); }

    /* ===== Custom Overlay Marker ===== */
    .gm-student{
      position:absolute;
      left:0; top:0;
      pointer-events:none;
      user-select:none;
    }

    /* Anchor the PIN TIP at the exact coordinate */
    .gm-pin-wrap{
      position:absolute;
      left:0; top:0;
      transform: translate(-50%, -100%);
      pointer-events:auto;
      cursor:pointer;
    }

    /* ✅ Wider pins + ✅ no shadow */
    .pin-svg{
      width:34px;        /* was 28px */
      height:44px;       /* keep proportion */
      filter:none;       /* removed shadow */
      display:block;
    }

    /* Card */
    .gm-card{
      pointer-events:auto;
      position:absolute;
      left:0;
      top:-50px;
      transform: translate(-50%, -100%);
      width:230px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(17,28,58,.92);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding:10px 12px;
      display:none;
      cursor:default;
    }
    .gm-card .t1{
      margin:0;
      font-weight:900;
      font-size:13px;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .gm-card .t2{
      margin:6px 0 0;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .gm-card .father{
      margin:8px 0 0;
      font-size:12px;
      color:var(--text);
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:8px;
      display:none;
    }
    .gm-card:hover .father{ display:block; }
    .gm-student.selected .gm-card{ display:block; }

    .gm-stem{
      position:absolute;
      left:0;
      top:-38px;
      transform: translate(-50%, -50%) rotate(45deg);
      width:10px;
      height:10px;
      background:rgba(17,28,58,.92);
      border-right:1px solid rgba(255,255,255,.12);
      border-bottom:1px solid rgba(255,255,255,.12);
      border-radius:2px;
      display:none;
      pointer-events:none;
    }
    .gm-student.selected .gm-stem{ display:block; }

    @media (max-width: 900px){
      .main{
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 0.9fr;
      }
      .side{ border-left:none; border-top:1px solid var(--border); }
      .control.search input{ width:220px; }
      .gm-card{ width:210px; }
      .pin-svg{ width:32px; height:42px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="main">
      <div class="map-wrap">
        <div id="map"></div>

        <div class="map-ui">
          <div class="ui-row center">
            <div class="control search">
              <input id="searchInput" type="text" placeholder="Search a place…" autocomplete="off" />
              <button id="clearBtn" class="btn" title="Clear pins">Clear</button>
            </div>
          </div>

          <div class="ui-row space">
            <div class="badge" id="status">Loading sheet…</div>

            <div style="display:flex; gap:10px; align-items:center; pointer-events:none;">
              <div class="control">
                Students:
                <input id="countInput" type="number" min="1" max="200" value="10" />
              </div>

              <div class="control">
                Radius (km):
                <input id="radiusInput" type="number" min="0" max="50" step="0.1" value="0" />
                <span style="opacity:.85">(0=all)</span>
              </div>

              <button id="applyBtn" class="btn">Apply</button>
            </div>
          </div>
        </div>

        <!-- Bottom-left stats -->
        <div class="stats-panel" aria-label="Nearby stats">
          <div class="statbox" id="stat100"><span>100m:</span> -</div>
          <div class="statbox" id="stat500"><span>500m:</span> -</div>
          <div class="statbox" id="stat1k"><span>1km:</span> -</div>
          <div class="statbox" id="stat2k"><span>2km:</span> -</div>
          <div class="statbox" id="stat5k"><span>5km:</span> -</div>
        </div>
      </div>

      <aside class="side">
        <h2 id="sideTitle">Nearby students will appear here</h2>
        <div id="list" class="list"></div>
      </aside>
    </div>
  </div>

  <script>
    /**
     * Sheet columns:
     * A Name, B Class, C Section, D Photo (not used on pins), E Lat, F Lng, G Father
     */
    const DATA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpSVxTGzDfwqzVE6euHpVY3oH_UzoJL8dnZD0TLwVblcOg85NWg4oWQHSpQPT67bNGXNinI9rFmqd7/pub?gid=413833735&single=true&output=csv";
    const MAX_SHOW = 2000;

    // exact coordinates
    const SPREAD_DUPLICATES = false;

    let students = [];
    let map;
    let placeMarker = null;
    let radiusCircle = null;
    let lastCenter = null;
    const studentOverlays = [];

    function setStatus(msg){ document.getElementById("status").textContent = msg; }
    function safeText(s){ return (s ?? "").toString().replace(/[<>]/g, ""); }

    function parseCSV(text){
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++){
        const c = text[i], next = text[i+1];
        if (c === '"'){
          if (inQuotes && next === '"'){ field += '"'; i++; }
          else inQuotes = !inQuotes;
          continue;
        }
        if (!inQuotes && (c === ',' || c === '\n' || c === '\r')){
          row.push(field.trim()); field = "";
          if (c === '\n'){
            if (row.length > 1 || row[0] !== "") rows.push(row);
            row = [];
          }
          continue;
        }
        field += c;
      }
      if (field.length || row.length){
        row.push(field.trim());
        if (row.length > 1 || row[0] !== "") rows.push(row);
      }
      return rows;
    }

    function distanceKm(lat1, lon1, lat2, lon2){
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function clearStudentOverlays(){
      for (const o of studentOverlays) o.setMap(null);
      studentOverlays.length = 0;
    }

    function drawRadius(center, radiusKmVal){
      if (radiusCircle) radiusCircle.setMap(null);
      radiusCircle = null;
      if (radiusKmVal > 0){
        radiusCircle = new google.maps.Circle({
          center,
          radius: radiusKmVal * 1000,
          strokeOpacity: 1,
          strokeWeight: 2,
          fillOpacity: 0.08,
          map
        });
      }
    }

    function updateStats(center){
      const el100 = document.getElementById("stat100");
      const el500 = document.getElementById("stat500");
      const el1k  = document.getElementById("stat1k");
      const el2k  = document.getElementById("stat2k");
      const el5k  = document.getElementById("stat5k");

      if (!center || !students.length){
        el100.innerHTML = `<span>100m:</span> -`;
        el500.innerHTML = `<span>500m:</span> -`;
        el1k.innerHTML  = `<span>1km:</span> -`;
        el2k.innerHTML  = `<span>2km:</span> -`;
        el5k.innerHTML  = `<span>5km:</span> -`;
        return;
      }

      let c100=0, c500=0, c1=0, c2=0, c5=0;
      for (const s of students){
        const d = distanceKm(center.lat, center.lng, s.lat, s.lon);
        if (d <= 0.1) c100++;
        if (d <= 0.5) c500++;
        if (d <= 1.0) c1++;
        if (d <= 2.0) c2++;
        if (d <= 5.0) c5++;
      }

      el100.innerHTML = `<span>100m:</span> ${c100}`;
      el500.innerHTML = `<span>500m:</span> ${c500}`;
      el1k.innerHTML  = `<span>1km:</span> ${c1}`;
      el2k.innerHTML  = `<span>2km:</span> ${c2}`;
      el5k.innerHTML  = `<span>5km:</span> ${c5}`;
    }

    function renderSidebar(list, totalInRange, center){
      const title = document.getElementById("sideTitle");
      const el = document.getElementById("list");
      el.innerHTML = "";

      if (!center){
        title.textContent = "Nearby students will appear here";
        return;
      }

      const radiusKmVal = Math.max(0, parseFloat(document.getElementById("radiusInput").value || "0"));
      const suffix = radiusKmVal > 0 ? ` within ${radiusKmVal} km` : ` (all)`;
      title.textContent = `Showing ${list.length} students out of ${totalInRange}${suffix}`;

      for (const s of list){
        const card = document.createElement("div");
        card.className = "rowcard";
        card.innerHTML = `
          <div class="rankPill">${s._rank}</div>
          <div class="meta">
            <p class="name">${safeText(s.name)}</p>
            <p class="sub">Class ${safeText(s.class)} • Section ${safeText(s.section)}</p>
            <p class="sub">Father: ${safeText(s.father || "-")}</p>
            <p class="sub">${s._dist.toFixed(2)} km away</p>
          </div>
        `;
        el.appendChild(card);
      }
    }

    async function loadStudents(){
      setStatus("Loading sheet…");
      const res = await fetch(DATA_CSV_URL);
      if (!res.ok) throw new Error(`CSV fetch failed: ${res.status}`);
      const text = await res.text();

      if (text.trim().startsWith("<!DOCTYPE html") || text.includes("<html")){
        throw new Error("URL returned HTML (not CSV). Use a published CSV link.");
      }

      const rows = parseCSV(text);
      const out = [];

      for (const r of rows){
        if (r.length < 6) continue;
        const lat = parseFloat(r[4]);
        const lon = parseFloat(r[5]);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

        out.push({
          name: r[0],
          class: r[1],
          section: r[2],
          photo: r[3],
          lat, lon,
          father: r[6] || ""
        });
      }

      students = out;
      setStatus(`Loaded ${students.length} students • Search or click map`);
      updateStats(null);
      return out;
    }

    async function initApp(){
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 27.6094, lng: 75.1399 },
        zoom: 12,
        mapTypeControl: true,
        streetViewControl: false,
        fullscreenControl: true
      });

      class StudentOverlay extends google.maps.OverlayView {
        constructor(position, student, rank){
          super();
          this.position = new google.maps.LatLng(position.lat, position.lng);
          this.student = student;
          this.rank = rank;
          this.div = null;
        }

        onAdd(){
          const div = document.createElement("div");
          div.className = "gm-student";

          const svg = `
            <svg class="pin-svg" viewBox="0 0 32 44" aria-label="Pin ${this.rank}">
              <path d="M16 43 C16 43 4 28.9 4 16.2 C4 8.0 9.8 2 16 2 C22.2 2 28 8.0 28 16.2 C28 28.9 16 43 16 43 Z"
                    fill="#e53935" stroke="rgba(0,0,0,0.20)" stroke-width="1"></path>
              <text x="16" y="17" text-anchor="middle" dominant-baseline="middle"
                    fill="#ffffff" font-size="12" font-weight="900">${this.rank}</text>
            </svg>
          `;

          div.innerHTML = `
            <div class="gm-card">
              <p class="t1">${safeText(this.student.name)}</p>
              <p class="t2">#${this.rank} • ${this.student._dist.toFixed(2)} km</p>
              <p class="t2">Class ${safeText(this.student.class)} • Sec ${safeText(this.student.section)}</p>
              <div class="father">Father: ${safeText(this.student.father || "-")}</div>
            </div>
            <div class="gm-stem"></div>
            <div class="gm-pin-wrap" title="Click to view">${svg}</div>
          `;

          const pinWrap = div.querySelector(".gm-pin-wrap");
          const card = div.querySelector(".gm-card");

          pinWrap.addEventListener("click", (e) => {
            e.stopPropagation();
            for (const o of studentOverlays){
              if (o.div) o.div.classList.remove("selected");
            }
            const willSelect = !div.classList.contains("selected");
            if (willSelect){
              div.classList.add("selected");
              div.style.zIndex = "999999";
            } else {
              div.classList.remove("selected");
              div.style.zIndex = "";
            }
          });

          card.addEventListener("click", (e) => e.stopPropagation());

          this.div = div;
          this.getPanes().overlayMouseTarget.appendChild(div);
        }

        draw(){
          if (!this.div) return;
          const proj = this.getProjection();
          if (!proj) return;

          const point = proj.fromLatLngToDivPixel(this.position);
          if (!point) return;

          this.div.style.left = point.x + "px";
          this.div.style.top  = point.y + "px";

          if (!this.div.style.zIndex){
            this.div.style.zIndex = String(100000 + Math.round(point.y));
          }
        }

        onRemove(){
          if (this.div){
            this.div.remove();
            this.div = null;
          }
        }
      }

      function runSearch(center){
        if (!students.length) return;
        lastCenter = center;

        updateStats(center);

        for (const o of studentOverlays){
          if (o.div) o.div.classList.remove("selected");
        }

        if (placeMarker) placeMarker.setMap(null);
        placeMarker = new google.maps.Marker({
          position: center,
          map,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 7,
            fillOpacity: 0.25,
            strokeOpacity: 1,
            strokeWeight: 2
          }
        });

        const n = Math.max(1, Math.min(MAX_SHOW, parseInt(document.getElementById("countInput").value || "10", 10)));
        const radiusKmVal = Math.max(0, parseFloat(document.getElementById("radiusInput").value || "0"));
        drawRadius(center, radiusKmVal);

        let scored = students.map(s => ({
          ...s,
          _dist: distanceKm(center.lat, center.lng, s.lat, s.lon)
        }));

        if (radiusKmVal > 0) scored = scored.filter(s => s._dist <= radiusKmVal);
        scored.sort((a,b) => a._dist - b._dist);

        const totalInRange = scored.length;

        for (let i = 0; i < scored.length; i++){
          scored[i]._rank = i + 1;
        }

        const list = scored.slice(0, n);

        clearStudentOverlays();

        for (const s of list){
          const pos = { lat: s.lat, lng: s.lon }; // exact coordinates
          const overlay = new StudentOverlay(pos, s, s._rank);
          overlay.setMap(map);
          studentOverlays.push(overlay);
        }

        renderSidebar(list, totalInRange, center);
      }

      map.addListener("click", (e) => {
        for (const o of studentOverlays){
          if (o.div) o.div.classList.remove("selected");
        }
        runSearch({ lat: e.latLng.lat(), lng: e.latLng.lng() });
      });

      document.getElementById("applyBtn").addEventListener("click", () => {
        if (lastCenter) runSearch(lastCenter);
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        clearStudentOverlays();
        if (placeMarker) placeMarker.setMap(null);
        placeMarker = null;
        if (radiusCircle) radiusCircle.setMap(null);
        radiusCircle = null;
        lastCenter = null;

        updateStats(null);
        document.getElementById("sideTitle").textContent = "Nearby students will appear here";
        document.getElementById("list").innerHTML = "";
      });

      const input = document.getElementById("searchInput");
      const autocomplete = new google.maps.places.Autocomplete(input, {
        fields: ["geometry", "name", "formatted_address"],
        componentRestrictions: { country: "in" }
      });

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place?.geometry?.location){
          setStatus("No result. Try a different search.");
          return;
        }
        const loc = place.geometry.location;
        const center = { lat: loc.lat(), lng: loc.lng() };
        map.panTo(center);
        map.setZoom(15);
        runSearch(center);
      });

      const data = await loadStudents();
      if (!data.length){
        setStatus("No valid rows found (check Latitude/Longitude columns).");
        return;
      }
      const bounds = new google.maps.LatLngBounds();
      for (const s of data) bounds.extend({ lat: s.lat, lng: s.lon });
      map.fitBounds(bounds);
    }

    window.initApp = initApp;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5VODPbqv2q3QGfv9DAtW7VX8_gQHvWlo&libraries=places&callback=initApp"
    async
    defer
  ></script>
</body>
</html>
